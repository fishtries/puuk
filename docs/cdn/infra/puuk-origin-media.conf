# Candidate only: install after DNS/TLS provisioning and backend off-mode deployment.
# Included from nginx http{}; validate with nginx -t before reload.
log_format puuk_media_safe '$status $request_method $uri $body_bytes_sent $request_time';

server {
    listen 80;
    server_name origin-media.puuk.fun;
    access_log /var/log/nginx/puuk-origin-media.access.log puuk_media_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/puuk-acme;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name origin-media.puuk.fun;
    ssl_certificate /etc/letsencrypt/live/origin-media.puuk.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin-media.puuk.fun/privkey.pem;
    access_log /var/log/nginx/puuk-origin-media.access.log puuk_media_safe;
    # Native or provider errors can carry signed URLs; avoid query-bearing error logs.
    error_log /dev/null;

    if ($ssl_server_name != origin-media.puuk.fun) { return 421; }
    if ($host != origin-media.puuk.fun) { return 421; }

    location ^~ /cdn/audio/ {
        # No URI suffix: retain the original request URI for strict ASGI validation.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host origin-media.puuk.fun;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # Forward the received value; never manufacture a valid secret for callers.
        # Duplicate client values become an invalid combined value, rejected by backend.
        proxy_set_header X-Puuk-Origin-Secret $http_x_puuk_origin_secret;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        gzip off;
    }
    location / { return 404; }
}
