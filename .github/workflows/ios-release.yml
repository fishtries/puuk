name: iOS Release & Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Сборка для:'
        required: true
        default: 'simulator'
        type: choice
        options:
          - 'simulator'
          - 'eas_production'
          - 'both'
      server_url:
        description: 'URL бэкенда (EXPO_PUBLIC_API_URL, опционально):'
        required: false
        default: ''
        type: string

jobs:
  validate:
    name: 🔍 Validate & Export Bundle
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🧪 Verify iOS Bundle Export
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: npx expo export --platform ios --no-bytecode

  build-simulator:
    name: 🍎 Build iOS Simulator (.app)
    needs: validate
    if: inputs.build_target == 'simulator' || inputs.build_target == 'both' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode version (>= 16.1 for React Native 0.86)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: ⚙️ Expo Prebuild (generate native iOS)
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: app/ios/puuk-ios/ios
        run: pod install

      - name: 🔨 Build for iOS Simulator (Release)
        working-directory: app/ios/puuk-ios/ios
        run: |
          xcodebuild -workspace Puuk.xcworkspace \
            -scheme Puuk \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Package .app for Simulator
        working-directory: app/ios/puuk-ios/ios/build/Build/Products/Release-iphonesimulator
        run: |
          zip -r Puuk-iOS-Simulator.zip Puuk.app

      - name: 📤 Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puuk-iOS-Simulator
          path: app/ios/puuk-ios/ios/build/Build/Products/Release-iphonesimulator/Puuk-iOS-Simulator.zip
          retention-days: 14

  build-eas:
    name: 🚀 EAS Build (App Store / TestFlight)
    needs: validate
    if: (inputs.build_target == 'eas_production' || inputs.build_target == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🔨 Trigger EAS Build
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: eas build --platform ios --profile production --non-interactive
