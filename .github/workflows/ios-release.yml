name: iOS Release & Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Сборка для:'
        required: true
        default: 'simulator'
        type: choice
        options:
          - 'simulator'
          - 'unsigned_ipa'
          - 'eas_production'
          - 'both'
      server_url:
        description: 'URL бэкенда (EXPO_PUBLIC_API_URL, опционально):'
        required: false
        default: ''
        type: string

jobs:
  validate:
    name: 🔍 Validate & Export Bundle
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🧪 Verify iOS Bundle Export
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: npx expo export --platform ios --no-bytecode

  build-simulator:
    name: 🍎 Build iOS Simulator (.app)
    needs: validate
    if: inputs.build_target == 'simulator' || inputs.build_target == 'both' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode version (>= 16.1 for React Native 0.86)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🩹 Patch Swift Tools Version (6.2 -> 6.0 for Xcode 16.2)
        working-directory: app/ios/puuk-ios
        run: node scripts/patch-swift-version.js

      - name: ⚙️ Expo Prebuild (generate native iOS)
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: app/ios/puuk-ios/ios
        run: pod install

      - name: 🔨 Build for iOS Simulator (Release)
        working-directory: app/ios/puuk-ios/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Puuk.xcworkspace \
            -scheme Puuk \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | (xcbeautify || cat)

      - name: 🚨 Print Error Log on Failure
        if: failure()
        working-directory: app/ios/puuk-ios/ios
        run: |
          echo "=== Recent errors from xcodebuild.log ==="
          grep -E -C 3 -i "error:" xcodebuild.log || tail -n 100 xcodebuild.log

      - name: 📦 Package .app for Simulator
        working-directory: app/ios/puuk-ios/ios
        run: |
          APP_PATH=$(find build -name "Puuk.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Puuk.app not found!"
            find build -maxdepth 5 -ls
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          (cd "$APP_DIR" && zip -r Puuk-iOS-Simulator.zip Puuk.app)
          mv "$APP_DIR/Puuk-iOS-Simulator.zip" ./

      - name: 📤 Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puuk-iOS-Simulator
          path: app/ios/puuk-ios/ios/Puuk-iOS-Simulator.zip
          retention-days: 14

  build-eas:
    name: 🚀 EAS Build (App Store / TestFlight)
    needs: validate
    if: (inputs.build_target == 'eas_production' || inputs.build_target == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🔨 Trigger EAS Build
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: eas build --platform ios --profile production --non-interactive

  build-unsigned-ipa:
    name: 📦 Build unsigned iOS IPA
    needs: validate
    if: inputs.build_target == 'unsigned_ipa'
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode version (>= 16.1 for React Native 0.86)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: app/ios/puuk-ios
        run: npm ci

      - name: 🩹 Patch Expo Swift manifests
        working-directory: app/ios/puuk-ios
        run: node scripts/patch-swift-version.js

      - name: ⚙️ Expo Prebuild (generate native iOS)
        working-directory: app/ios/puuk-ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.server_url }}
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: app/ios/puuk-ios/ios
        run: pod install

      - name: 🔨 Build unsigned device app
        working-directory: app/ios/puuk-ios/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Puuk.xcworkspace \
            -scheme Puuk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-unsigned.log | (xcbeautify || cat)

      - name: 📦 Package unsigned IPA
        working-directory: app/ios/puuk-ios/ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Puuk.app"
          test -d "$APP_PATH" || {
            echo "Error: device Puuk.app not found at $APP_PATH"
            find build -name "Puuk.app" -type d -print
            exit 1
          }
          rm -rf Payload Puuk-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Puuk.app
          /usr/bin/zip -qry Puuk-unsigned.ipa Payload

      - name: 📤 Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Puuk-iOS-unsigned-IPA
          path: app/ios/puuk-ios/ios/Puuk-unsigned.ipa
          retention-days: 14
