name: Build Empty Expo Unsigned IPA

on:
  push:
    paths:
      - 'empty-expo/**'
      - '.github/workflows/build-empty-expo-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-empty-expo-unsigned
  cancel-in-progress: false

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: empty-expo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: empty-expo/package-lock.json

      - name: Print build environment
        run: |
          echo "=== macOS version ==="
          sw_vers
          echo "=== Available Xcode apps ==="
          ls -d /Applications/Xcode*.app || true
          echo "=== Active Xcode & Swift ==="
          xcodebuild -version
          swiftc --version
          echo "=== DEVELOPER_DIR ==="
          echo "${DEVELOPER_DIR:-not set}"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned archive
        run: |
          mkdir -p build
          ARCHIVE_LOG="$(pwd)/build/archive.log"

          echo "Starting xcodebuild archive..."
          xcodebuild archive \
            -workspace ios/EmptyExpo.xcworkspace \
            -scheme EmptyExpo \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/EmptyExpo.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$ARCHIVE_LOG"

      - name: Verify application bundle
        run: |
          APP_PATH="$(find build/EmptyExpo.xcarchive/Products -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in archive!" >&2
            find build/EmptyExpo.xcarchive || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y -q EmptyExpo-unsigned.ipa Payload
          shasum -a 256 EmptyExpo-unsigned.ipa > EmptyExpo-unsigned.ipa.sha256
          echo "=== Generated IPA ==="
          ls -lh EmptyExpo-unsigned.ipa
          cat EmptyExpo-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empty-expo-unsigned-ipa
          path: |
            empty-expo/build/EmptyExpo-unsigned.ipa
            empty-expo/build/EmptyExpo-unsigned.ipa.sha256
            empty-expo/build/archive.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish build status to ci branch
        if: always()
        run: |
          STATUS_DIR="$RUNNER_TEMP/ci-status"
          rm -rf "$STATUS_DIR"
          mkdir -p "$STATUS_DIR"

          if [ -f build/EmptyExpo-unsigned.ipa ]; then
            echo "STATUS=SUCCESS" > "$STATUS_DIR/STATUS.txt"
            echo "IPA_SIZE=$(ls -lh build/EmptyExpo-unsigned.ipa | awk '{print $5}')" >> "$STATUS_DIR/STATUS.txt"
            echo -n "SHA256=" >> "$STATUS_DIR/STATUS.txt"
            cat build/EmptyExpo-unsigned.ipa.sha256 >> "$STATUS_DIR/STATUS.txt"
          else
            echo "STATUS=FAILED" > "$STATUS_DIR/STATUS.txt"
          fi

          echo "JOB_STATUS=${{ job.status }}" >> "$STATUS_DIR/STATUS.txt"
          echo "RUN_ID=$GITHUB_RUN_ID" >> "$STATUS_DIR/STATUS.txt"
          echo "RUN_NUMBER=$GITHUB_RUN_NUMBER" >> "$STATUS_DIR/STATUS.txt"
          echo "COMMIT=$GITHUB_SHA" >> "$STATUS_DIR/STATUS.txt"

          if [ -f build/archive.log ]; then
            grep -n -C 3 -E 'error:|fatal error:|Build ExpoModulesJSI' build/archive.log > "$STATUS_DIR/errors.txt" || true
            tail -n 250 build/archive.log > "$STATUS_DIR/tail-log.txt"
          fi

          cd "$STATUS_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/empty-expo-status
          git add .
          git commit -m "ci(empty-expo): build status for run $GITHUB_RUN_ID ($GITHUB_RUN_NUMBER) [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" ci/empty-expo-status || echo "Could not push status branch"
