name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-unsigned
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/ios/puuk-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ios/puuk-ios/package-lock.json

      - name: Select newest Xcode
        run: |
          XCODE_APP="/Applications/Xcode_26.2.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: expected $XCODE_APP on macos-26 runner" >&2
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swiftc --version

      - name: Verify Swift tools version
        run: |
          PACKAGE_SWIFT="node_modules/expo-modules-jsi/apple/Package.swift"
          REQUIRED_TOOLS="$(sed -n 's|^// swift-tools-version: *||p' "$PACKAGE_SWIFT" | head -n 1)"
          SWIFTC_VERSION="$(swiftc --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          echo "ExpoModulesJSI Swift tools version: $REQUIRED_TOOLS"
          echo "Installed Swift compiler version: $SWIFTC_VERSION"
          case "$SWIFTC_VERSION" in
            6.2*) ;;
            *)
              echo "ERROR: ExpoModulesJSI requires Swift 6.2, but the selected Xcode provides Swift $SWIFTC_VERSION" >&2
              exit 1
              ;;
          esac

      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version

      - name: Install dependencies
        run: npm ci

      - name: Verify expo-modules-jsi patch
        run: |
          echo "--- Checking if patch was applied ---"
          RUNTIME_SWIFT="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift"
          if ! grep -q "assumeIsolated { \[thisPtr, argumentsPtr\] in" "$RUNTIME_SWIFT"; then
            echo "ERROR: expo-modules-jsi patch did not apply!" >&2
            echo "Line 770:" >&2
            sed -n '770p' "$RUNTIME_SWIFT" >&2
            echo "Line 813:" >&2
            sed -n '813p' "$RUNTIME_SWIFT" >&2
            exit 1
          fi
          echo "✓ Patch applied successfully"
          grep -n "assumeIsolated { \[thisPtr, argumentsPtr\] in" "$RUNTIME_SWIFT" | head -3

      - name: Invalidate SPM cache for patched ExpoModulesJSI
        run: |
          echo "--- Clearing SPM build cache to force rebuild with patched sources ---"
          JSI_ROOT="node_modules/expo-modules-jsi/apple"
          rm -rf "$JSI_ROOT/.DerivedData" "$JSI_ROOT/.build" "$JSI_ROOT/.xcframework-slices"
          echo "✓ SPM cache cleared"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Inspect Xcode project
        run: |
          ls -la ios
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | sort | head -n 1)"
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: no .xcworkspace found under ios/" >&2
            exit 1
          fi
          xcodebuild -list -workspace "$WORKSPACE"
          APP_SCHEME="$(node -e "console.log(require('./app.json').expo.name.replace(/[^A-Za-z0-9_-]/g, ''))")"
          if ! xcodebuild -list -workspace "$WORKSPACE" \
            | awk '/Schemes:/,/^$/' \
            | sed '1d; s/^[[:space:]]*//' \
            | grep -Fxq "$APP_SCHEME"; then
            echo "ERROR: application scheme '$APP_SCHEME' was not found" >&2
            exit 1
          fi
          echo "Application scheme: $APP_SCHEME"

      - name: Build unsigned archive
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | sort | head -n 1)"
          APP_SCHEME="$(node -e "console.log(require('./app.json').expo.name.replace(/[^A-Za-z0-9_-]/g, ''))")"
          echo "Building workspace: $WORKSPACE, application scheme: $APP_SCHEME"
          if ! xcodebuild -list -workspace "$WORKSPACE" \
            | awk '/Schemes:/,/^$/' \
            | sed '1d; s/^[[:space:]]*//' \
            | grep -Fxq "$APP_SCHEME"; then
            echo "ERROR: application scheme '$APP_SCHEME' was not found" >&2
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          ARCHIVE_LOG="$GITHUB_WORKSPACE/app/ios/puuk-ios/build/xcodebuild-archive.log"
          mkdir -p "$(dirname "$ARCHIVE_LOG")"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Puuk.xcarchive \
            -derivedDataPath build/DerivedData \
            -jobs 1 \
            -showBuildTimingSummary \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$ARCHIVE_LOG"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "--- ExpoModulesJSI diagnostics ---" >&2
            grep -n -E 'ExpoModulesJSI|(^|[[:space:]])error:|fatal error:' "$ARCHIVE_LOG" | tail -n 200 >&2 || true
            exit "$STATUS"
          fi

      - name: Verify unsigned .app
        run: |
          APP_PATH="$(find build/Puuk.xcarchive/Products -maxdepth 3 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found in archive" >&2
            find build/Puuk.xcarchive -maxdepth 4 || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          file "$APP_PATH/$(basename "$APP_PATH" .app)"
          echo "--- codesign info (unsigned is expected) ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || echo "App has no valid Apple signature, as expected"

      - name: Package IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Puuk.app
          cd build
          zip -r -y -q Puuk-unsigned.ipa Payload
          shasum -a 256 Puuk-unsigned.ipa > Puuk-unsigned.ipa.sha256
          unzip -l Puuk-unsigned.ipa | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: puuk-ios-unsigned-ipa
          path: |
            app/ios/puuk-ios/build/Puuk-unsigned.ipa
            app/ios/puuk-ios/build/Puuk-unsigned.ipa.sha256
            app/ios/puuk-ios/build/xcodebuild-archive.log
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Unsigned IPA created successfully"
            echo ""
            echo "1. Download the artifact \`puuk-ios-unsigned-ipa\` from this run."
            echo "2. Open the .ipa in Sideloadly, sign with your Apple ID, install on iPhone."
          } >> "$GITHUB_STEP_SUMMARY"
